spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/524de923-14d5-4e21-bbbf-525ca2e1ced7/
          jwk-set-uri: https://login.microsoftonline.com/524de923-14d5-4e21-bbbf-525ca2e1ced7/discovery/keys

# URLs internas de los microservicios. En Docker usar los nombres de servicio de infra/compose.yml,
# ej. RESERVATIONS_URL=http://reservations:8081
andesstay:
  services:
    reservations:
      url: ${RESERVATIONS_URL:http://localhost:8081}
    catalog:
      url: ${CATALOG_URL:http://localhost:8085}
    audit:
      url: ${AUDIT_URL:http://localhost:8086}
    report:
      url: ${REPORT_URL:http://localhost:8087}

# Solo /actuator/health (healthcheck de Docker)
management:
  endpoints:
    web:
      exposure:
        include: health
